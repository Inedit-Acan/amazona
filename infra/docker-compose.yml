services:
  postgres:
    image: postgres:16-alpine
    container_name: amazona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amazona}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amazona}
      POSTGRES_DB: ${POSTGRES_DB:-amazona}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - amazona-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazona} -d ${POSTGRES_DB:-amazona}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: amazona-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amazona-postgres-data:
