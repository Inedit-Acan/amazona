name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests, migration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amazona
          POSTGRES_PASSWORD: amazona
          POSTGRES_DB: amazona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amazona -d amazona"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://amazona:amazona@localhost:5432/amazona

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app

      - name: Apply migrations to a clean PostgreSQL database
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Control Center (lint, types, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json

      - name: Install dependencies
        working-directory: apps/control-center
        run: npm ci

      - name: Lint
        working-directory: apps/control-center
        run: npm run lint

      - name: Generate route types
        working-directory: apps/control-center
        run: npx next typegen

      - name: Type check
        working-directory: apps/control-center
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/control-center
        run: npm test

      - name: Build
        working-directory: apps/control-center
        run: npm run build
